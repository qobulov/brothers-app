info:
  contact: {}
  description: REST API for Brothers App following Clean Architecture.
  title: Brothers App API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates an active user using a username or email address
        and password.
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/authdto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Sign in with username or email
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the current authenticated session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.EmptyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Log out
      tags:
      - auth
  /auth/otp/send:
    post:
      consumes:
      - application/json
      description: Sends an OTP for registration or password reset. Password reset
        accepts either email or username, returns 404 if the account does not exist,
        and returns the recipient email when delivery is started.
      parameters:
      - description: OTP purpose and email or username
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authdto.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.StartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Send OTP
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: Replaces the password using a reset-only token and revokes the
        active session.
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authdto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.EmptyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Reset password
      tags:
      - auth
  /auth/password/verify:
    post:
      consumes:
      - application/json
      description: Exchanges an email-delivered reset OTP for a single-use reset token.
      parameters:
      - description: Email and OTP
        in: body
        name: verification
        required: true
        schema:
          $ref: '#/definitions/authdto.OTPVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.ResetVerifyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Verify password-reset OTP
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates the opaque refresh token and returns a new token pair.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authdto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Refresh session tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Verifies the registration OTP, creates the user, and issues a token
        pair. Request an OTP first through POST /auth/otp/send.
      parameters:
      - description: Registration payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/authdto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Register user
      tags:
      - auth
  /auth/username/check:
    get:
      description: Public, no token. Usernames are a-z, 0-9 and underscores, 5-32
        characters, stored in lowercase; the response returns the normalized form.
        A taken username returns 200 with available=false; a badly formatted one returns
        400.
      parameters:
      - description: Username to check
        in: query
        maxLength: 32
        minLength: 5
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.UsernameAvailabilityResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Check whether a username is available
      tags:
      - auth
  /debts:
    get:
      description: Newest first. Only the caller's own debts.
      parameters:
      - description: Direction
        enum:
        - they_owe_me
        - i_owe
        in: query
        name: direction
        type: string
      - default: active
        description: Status
        enum:
        - active
        - completed
        - all
        in: query
        name: status
        type: string
      - description: Search by name or phone
        in: query
        maxLength: 100
        name: query
        type: string
      - default: 50
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of debts to skip
        in: query
        maximum: 10000
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/debt.DebtsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my debts
      tags:
      - debts
    post:
      consumes:
      - application/json
      description: A private debt visible only to the caller. It does not affect any
        group balance.
      parameters:
      - description: Debt
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/debt.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/debt.DebtResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a debt
      tags:
      - debts
  /debts/{debtID}:
    delete:
      parameters:
      - description: Debt UUID
        in: path
        name: debtID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a debt
      tags:
      - debts
    get:
      parameters:
      - description: Debt UUID
        in: path
        name: debtID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/debt.DebtResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a debt
      tags:
      - debts
  /debts/{debtID}/complete:
    post:
      description: Closes an active debt; the remaining amount is kept as is.
      parameters:
      - description: Debt UUID
        in: path
        name: debtID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/debt.DebtResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark a debt as completed
      tags:
      - debts
  /debts/{debtID}/repayments:
    get:
      parameters:
      - description: Debt UUID
        in: path
        name: debtID
        required: true
        type: string
      - default: 50
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Number of repayments to skip
        in: query
        maximum: 10000
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/debt.RepaymentsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Repayment history of a debt
      tags:
      - debts
    post:
      consumes:
      - application/json
      description: Partial repayments are supported. Reaching zero completes the debt.
      parameters:
      - description: Debt UUID
        in: path
        name: debtID
        required: true
        type: string
      - description: Repayment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/debt.RepaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/debt.DebtResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Record a repayment
      tags:
      - debts
  /debts/summary:
    get:
      description: Remaining amounts of active debts, per currency and direction.
        Currencies are never converted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/debt.SummaryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Debt totals
      tags:
      - debts
  /groups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/group.GroupsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/group.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my groups
      tags:
      - groups
    post:
      consumes:
      - application/json
      parameters:
      - description: Group payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/group.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/group.GroupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/group.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/group.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a group
      tags:
      - groups
  /groups/{groupID}:
    delete:
      consumes:
      - application/json
      description: Owner-only operation. Requires an explicit confirmation and preserves
        financial and audit history.
      parameters:
      - description: Group UUID
        in: path
        name: groupID
        required: true
        type: string
      - description: Deletion confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/group.DeleteRequest'
      produces:
      - application/json
      responses:
