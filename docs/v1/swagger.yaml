info:
  contact: {}
  description: REST API for Brothers App following Clean Architecture.
  title: Brothers App API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates an active user using a username or email address
        and password.
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/authdto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Sign in with username or email
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the current authenticated session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.EmptyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Log out
      tags:
      - auth
  /auth/otp/send:
    post:
      consumes:
      - application/json
      description: Sends an OTP for registration or password reset. Password reset
        accepts either email or username and returns the recipient email when delivery
        is started.
      parameters:
      - description: OTP purpose and email or username
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authdto.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.StartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Send OTP
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: Replaces the password using a reset-only token and revokes the
        active session.
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authdto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.EmptyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Reset password
      tags:
      - auth
  /auth/password/verify:
    post:
      consumes:
      - application/json
      description: Exchanges an email-delivered reset OTP for a single-use reset token.
      parameters:
      - description: Email and OTP
        in: body
        name: verification
        required: true
        schema:
          $ref: '#/definitions/authdto.OTPVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.ResetVerifyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Verify password-reset OTP
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates the opaque refresh token and returns a new token pair.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authdto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Refresh session tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Verifies the registration OTP, creates the user, and issues a token
        pair. Request an OTP first through POST /auth/otp/send.
      parameters:
      - description: Registration payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/authdto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Register user
      tags:
      - auth
  /groups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/group.GroupsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/group.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List my groups
      tags:
      - groups
    post:
      consumes:
      - application/json
      parameters:
      - description: Group payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/group.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/group.GroupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/group.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/group.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a group
      tags:
      - groups
  /groups/{groupID}:
    delete:
      consumes:
      - application/json
      description: Owner-only operation. Requires an explicit confirmation and preserves
        financial and audit history.
      parameters:
      - description: Group UUID
        in: path
        name: groupID
        required: true
        type: string
      - description: Deletion confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/group.DeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/group.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/group.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/group.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/group.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Soft-delete a group
      tags:
      - groups
  /groups/{groupID}/customers:
    get:
      description: This resource is read-only. The optional query parameter filters
        by phone.
      parameters:
      - description: Group UUID
        in: path
        name: groupID
        required: true
        type: string
      - description: Phone search
        in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/group.CustomersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/group.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/group.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/group.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List group customers
      tags:
      - group customers
  /groups/{groupID}/invitations:
    post:
      consumes:
      - application/json
      parameters:
      - description: Group UUID
        in: path
        name: groupID
        required: true
        type: string
      - description: Invitation payload; provide user_id or email
        in: body
        name: request
