        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/group.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/group.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get one group member
      tags:
      - group members
