info:
  contact: {}
  description: REST API for Brothers App following Clean Architecture.
  title: Brothers App API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates an active user using a username or email address
        and password.
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/authdto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Sign in with username or email
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the current authenticated session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.EmptyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Log out
      tags:
      - auth
  /auth/otp/send:
    post:
      consumes:
      - application/json
      description: Sends an OTP for registration or password reset. Password reset
        accepts either email or username and returns the recipient email when delivery
        is started.
      parameters:
      - description: OTP purpose and email or username
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authdto.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.StartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Send OTP
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: Replaces the password using a reset-only token and revokes the
        active session.
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/authdto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.EmptyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Reset password
      tags:
      - auth
  /auth/password/verify:
    post:
      consumes:
      - application/json
      description: Exchanges an email-delivered reset OTP for a single-use reset token.
      parameters:
      - description: Email and OTP
        in: body
        name: verification
        required: true
        schema:
          $ref: '#/definitions/authdto.OTPVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdto.ResetVerifyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/authdto.ErrorResponse'
      summary: Verify password-reset OTP
      tags:
