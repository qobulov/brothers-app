basePath: /api/v1
definitions:
  authdto.AuthData:
    properties:
      tokens:
        $ref: '#/definitions/authdto.TokenData'
      user:
        $ref: '#/definitions/authdto.UserData'
    type: object
  authdto.AuthResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/authdto.AuthData'
      message:
        example: Request processed successfully
        type: string
      meta:
        $ref: '#/definitions/authdto.ResponseMeta'
      slug:
        example: ok
        type: string
      success:
        example: true
        type: boolean
    type: object
  authdto.EmptyResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        x-nullable: true
      message:
        example: Request processed successfully
        type: string
      meta:
        $ref: '#/definitions/authdto.ResponseMeta'
      slug:
        example: ok
        type: string
      success:
        example: true
        type: boolean
    type: object
  authdto.ErrorResponse:
    properties:
      code:
        example: 1400
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/responses.ErrorDetails'
        x-nullable: true
      message:
        example: Некорректные данные
        type: string
      meta:
        $ref: '#/definitions/authdto.ResponseMeta'
      slug:
        example: invalid_data
        type: string
      success:
        example: false
        type: boolean
    type: object
  authdto.LoginRequest:
    properties:
      login:
        example: qobulov
        type: string
      password:
        example: strong-password
        type: string
    type: object
  authdto.OTPVerifyRequest:
    properties:
      email:
        example: ali@example.com
        type: string
      otp:
        example: "482910"
        type: string
    type: object
  authdto.RefreshRequest:
    properties:
      refresh_token:
        example: opaque-refresh-token
        type: string
    type: object
  authdto.RegisterData:
    properties:
      tokens:
        $ref: '#/definitions/authdto.TokenData'
      user:
        $ref: '#/definitions/authdto.RegisterUserData'
    type: object
  authdto.RegisterRequest:
    properties:
      avatar_url:
        example: https://example.com/avatar.jpg
        type: string
      email:
        example: ali@example.com
        type: string
      first_name:
        example: Azizbek
        type: string
      language:
        example: uz
        type: string
      last_name:
        example: Qobulov
        type: string
      otp_code:
        example: "482910"
        type: string
      password:
        example: strong-password
        type: string
      phone:
        example: "+998901234567"
        type: string
      username:
        example: qobulov
        type: string
    type: object
  authdto.RegisterResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/authdto.RegisterData'
      message:
        example: Request processed successfully
        type: string
      meta:
        $ref: '#/definitions/authdto.ResponseMeta'
      slug:
        example: ok
        type: string
      success:
        example: true
        type: boolean
    type: object
  authdto.RegisterUserData:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  authdto.ResetPasswordRequest:
    properties:
      password:
        example: new-strong-password
        type: string
      reset_token:
        example: opaque-reset-token
        type: string
    type: object
  authdto.ResetVerifyData:
    properties:
      expires_at:
        type: string
      reset_token:
        type: string
    type: object
  authdto.ResetVerifyResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/authdto.ResetVerifyData'
      message:
        example: Request processed successfully
        type: string
      meta:
        $ref: '#/definitions/authdto.ResponseMeta'
      slug:
        example: ok
        type: string
      success:
        example: true
        type: boolean
    type: object
  authdto.ResponseMeta:
    properties:
      api_version:
        example: v1
        type: string
      duration:
        example: 2.22896ms
        type: string
      request_id:
        example: aaddf89a9a081829a856613eff19682b
        type: string
      service:
        example: brothers_app
        type: string
      timestamp:
        example: "2026-09-22T12:55:03Z"
        type: string
    type: object
  authdto.SendOTPRequest:
    properties:
      email:
        description: |-
          Email is required for registration. For password_reset, provide exactly
          one of Email or Username.
        example: ali@example.com
        type: string
      purpose:
        enum:
        - registration
        - password_reset
        example: registration
        type: string
      username:
        example: qobulov
        type: string
    type: object
  authdto.StartData:
    properties:
      email:
