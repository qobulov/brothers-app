version: "2"

sql:
  - engine: "postgresql"
    schema:
      - "migrations/*.up.sql"
    queries: "db/sqlc/query"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        query_parameter_limit: 0
